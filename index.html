<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Concepts</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0}body{background:#0a0a0c;color:#f4f4f5;font:16px/1.5 Inter,system-ui,sans-serif;min-height:100vh;padding:8vw 6vw}
small{color:#8b8b93;letter-spacing:.2em;font-size:12px;font-weight:600}h1{font-size:clamp(44px,9vw,120px);line-height:.95;letter-spacing:-.05em;font-weight:800;margin:18px 0 60px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
a{display:block;padding:28px;border:1px solid #232328;border-radius:20px;background:#111114;text-decoration:none;color:inherit;transition:.25s}
a:hover{transform:translateY(-6px);border-color:#b5ff6b}a b{display:block;font-size:26px;letter-spacing:-.03em}a span{color:#8b8b93}a i{float:right;font-style:normal;color:#b5ff6b}</style></head>
<body><small>WEB DESIGN CONCEPTS</small><h1>Three sites.<br>Three vibes.</h1>
<div class="g"><a href="cafe/"><i>→</i><b>Maison Ember</b><span>Cafe</span></a><a href="barbershop/"><i>→</i><b>Northline Barber</b><span>Barbershop</span></a><a href="saas/"><i>→</i><b>Flowdesk</b><span>SaaS</span></a></div></body></html>
